name: Windows Build

on:
  workflow_call:
    secrets:
      AZURE_KEY_VAULT_URI:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_CERT_NAME:
        required: false

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install AzureSignTool
        run: |
          dotnet tool install --global AzureSignTool
          # Fix globalsign shenanigans of them not publishing the certificate
          Import-Certificate -CertStoreLocation "Cert:\CurrentUser\CA" -FilePath ".github/workflows/globalsign-timestamp-cert.cer"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.2'
          distribution: 'zulu'
          cache: gradle
          java-package: jdk
        if: ${{ contains(runner.arch, 'X64') == true }}

      - name: Set up ARM JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.2'
          distribution: 'liberica'
          cache: gradle
          java-package: jdk+fx
        if: ${{ contains(runner.arch, 'ARM64') == true }}

      - name: Execute dist build
        run: |
          gradlew.bat clean dist --stacktrace
        shell: cmd
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME}}
          RELEASE: ${{ contains(github.event.head_commit.message, '[release]') == true }}

      - name: Stop gradle daemon
        run: ./gradlew.bat --stop

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-artifacts
          retention-days: 1
          compression-level: 1
          include-hidden-files: true
          path: |
            dist/build/dist/artifacts/*

      - name: Upload Steam build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-steam
          retention-days: 1
          compression-level: 1
          include-hidden-files: true
          path: dist/build/dist/portable
