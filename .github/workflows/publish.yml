name: Build/Publish

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  build-windows:
    uses: ./.github/workflows/windows_build.yml
    secrets:
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
    name: Windows Build
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
  build-linux:
    uses: ./.github/workflows/linux_build.yml
    name: Linux Build
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
  build-macos:
    uses: ./.github/workflows/macos_build.yml
    secrets:
      MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE }}
      MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE }}
      MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_NAME: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_NAME }}
      MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_NAME: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_NAME }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_APP_SPECIFIC_PASSWORD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    name: macOS Build
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

  publish:
    needs: [
      build-windows,
      build-linux,
      build-macos
    ]
    name: Publish
    if: ${{ contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: write
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set variables
        run: |
          VER=$(cat "version")
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Create version tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # The job token is scoped to this repository and run, unlike a personal access token
          github-token: ${{ github.token }}
          # The version is passed via the environment instead of being interpolated into the script source
          script: |
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${process.env.VERSION}`,
                sha: context.sha
              });
            } catch (e) {
              // Allow rerunning a release for which the tag was already created
              if (e.status === 422) {
                core.info(`Tag ${process.env.VERSION} already exists`);
              } else {
                throw e;
              }
            }

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.2'
          distribution: 'zulu'
          java-package: jdk

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist/build/dist/artifacts

      - name: Create changelog, artifacts, signatures, checksums
        run: ./gradlew createGithubChangelog createChecksums signArtifacts signChecksums prepareGitHubRelease
        env:
          RELEASE: ${{ contains(github.event.head_commit.message, '[release]') == true }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY: |
            ${{ secrets.GPG_KEY }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Download legacy artifacts
        run: |
          curl -L --output "dist/build/dist/github-release/changelog.txt" "https://github.com/crschnick/pdx_unlimiter/releases/download/2.13.18/changelog.txt"
          curl -L --output "dist/build/dist/github-release/pdx_unlimiter-windows.zip" "https://github.com/crschnick/pdx_unlimiter/releases/download/2.13.18/pdx_unlimiter-windows.zip"
          curl -L --output "dist/build/dist/github-release/pdx_unlimiter-linux.zip" "https://github.com/crschnick/pdx_unlimiter/releases/download/2.13.18/pdx_unlimiter-linux.zip"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/build/dist/release/github-changelog.md
          token: ${{ github.token }}
          preserve_order: true
          prerelease: false
          make_latest: true
          tag_name: ${{ env.VERSION }}
          files: |
            dist/build/dist/github-release/*

  publish-aur:
    name: Publish AUR
    timeout-minutes: 30
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    if: ${{ contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    needs: [
      publish
    ]
    container:
      image: archlinux:base-devel
      env:
        RELEASE: ${{ contains(github.event.head_commit.message, '[release]') == true }}
        AUR_SSH_KEY: |
          ${{ secrets.AUR_SSH_KEY }}
      volumes:
        - .:/mnt/pdx_unlimiter
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.2'
          distribution: 'zulu'
          java-package: jdk

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist/build/dist/artifacts

      - name: Create checksums
        run: ./gradlew createChecksums

      - name: Create signatures
        run: ./gradlew signArtifacts signChecksums
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY: |
            ${{ secrets.GPG_KEY }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Create key
        run: |
          mkdir -p dist/build
          echo "$AUR_SSH_KEY" > dist/build/aur_key

      - name: Run AUR publish
        run: |
          useradd -d /builder -m builder
          pacman -Sy --noconfirm --needed zip unzip git openssh
          chown -R builder /mnt/pdx_unlimiter/
          su builder -c "cd /mnt/pdx_unlimiter/; ./gradlew publishAUR"

  publish-steam:
    needs: [
      build-windows,
      build-linux,
      build-macos
    ]
    name: Publish Steam
    if: ${{ contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: none
      attestations: none
      checks: none
      contents: write
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set variables
        run: |
          VER=$(cat "version")
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Download Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "windows-steam"
          merge-multiple: true
          path: dist/build/dist/depots/windows

      - name: Download Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "linux-steam"
          merge-multiple: true
          path: dist/build/dist/depots/linux

      - name: Download macOS ARM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "macos-arm-steam"
          merge-multiple: true
          path: dist/build/dist/depots/macos-arm

      - uses: game-ci/steam-deploy@50f6b29fc64922e19a16d202a88fe199d394b536 # v3.2.1
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF}}
          appId: 4170030
          buildDescription: ${{ env.VERSION }}
          rootPath: dist/build/dist/depots
          depot1Path: windows
          depot2Path: linux
          depot4Path: macos-arm
          releaseBranch: prerelease
        continue-on-error: true